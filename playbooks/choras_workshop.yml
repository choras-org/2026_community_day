# SRC component: one CHORAS instance per participant behind SRC-Nginx.
# Catalog item order: SRC-OS, SRC-CO, SRC-Nginx, SRC-External plugin, this playbook.
# Outside SRC, run local_prepare.yml first (an Nginx stand-in for SRC-Nginx).
- name: CHORAS workshop
  hosts: localhost
  gather_facts: true

  pre_tasks:
    - name: Parse the comma-separated parameters
      ansible.builtin.set_fact:
        choras_participant_list: "{{ choras_participants.split(',') | map('trim') | reject('equalto', '') | list }}"
        choras_method_list: "{{ choras_methods.split(',') | map('trim') | reject('equalto', '') | list }}"

    # Logins end up in Nginx config, file paths and compose project names.
    - name: Check the participant names
      ansible.builtin.assert:
        that:
          - choras_participant_list | length > 0
          - choras_participant_list | select('match', '^[a-z0-9_-]+$') | list | length == choras_participant_list | length
          - choras_participant_list | unique | length == choras_participant_list | length
        fail_msg: "choras_participants must be unique names of lowercase letters, digits, - and _: {{ choras_participants }}"

    - name: Install git
      ansible.builtin.apt:
        name: git
        update_cache: true

    - name: Check whether Docker with the compose plugin is installed
      ansible.builtin.command: docker compose version
      register: choras_docker
      changed_when: false
      failed_when: false

    # Only when missing: Ubuntu's docker.io conflicts with Docker's own docker-ce,
    # which an image or another component may already have installed.
    - name: Install Docker from the Ubuntu packages
      ansible.builtin.apt:
        name: [docker.io, docker-compose-v2]
      when: choras_docker.rc != 0

    # Docker's default pools give each compose network a /16 and run out after
    # about 15 networks (one per participant). /24s from 172.20.0.0/14 give 1024.
    - name: Create the Docker config directory
      ansible.builtin.file:
        path: /etc/docker
        state: directory
        mode: "0755"

    # shortcut: overwrites an existing daemon.json; the SRC image has none.
    - name: Give each Docker network a /24
      ansible.builtin.copy:
        dest: /etc/docker/daemon.json
        content: |
          {"default-address-pools": [{"base": "172.20.0.0/14", "size": 24}]}
        mode: "0644"
      register: choras_docker_daemon

    - name: Start Docker
      ansible.builtin.service:
        name: docker
        state: "{{ 'restarted' if choras_docker_daemon.changed else 'started' }}"
        enabled: true

    - name: Check that the SRC-Nginx include directory exists
      ansible.builtin.stat:
        path: /etc/nginx/app-location-conf.d
      register: choras_nginx_dir

    - name: Stop if there's no SRC-Nginx (or stand-in)
      ansible.builtin.assert:
        that: choras_nginx_dir.stat.isdir | default(false)
        fail_msg: "/etc/nginx/app-location-conf.d is missing: add SRC-Nginx before this component, or run local_prepare.yml"

  roles:
    - choras_build
    - choras_instances
    - choras_nginx

  post_tasks:
    - name: Show where to log in
      ansible.builtin.debug:
        msg: "CHORAS runs at {{ choras_public_url }} for {{ choras_participant_list | length }} participants; logins in {{ choras_credentials_file }}"
