# For a plain Ubuntu machine instead of SRC (test VM, local-network fallback):
# installs what the SRC catalog item otherwise provides. Run before choras_workshop.yml.
- name: Prepare a non-SRC machine for the CHORAS workshop
  hosts: localhost
  gather_facts: true

  # pre_tasks, because roles run before tasks and the role needs nginx.
  pre_tasks:
    - name: Install Docker, git and nginx
      ansible.builtin.apt:
        name: [docker.io, docker-compose-v2, git, nginx, openssl]
        update_cache: true

  roles:
    - nginx_standin
