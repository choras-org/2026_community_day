# For a plain Ubuntu machine instead of SRC (test VM, local-network fallback):
# installs what SRC-Nginx otherwise provides. Run before choras_workshop.yml,
# which installs Docker and git itself.
- name: Prepare a non-SRC machine for the CHORAS workshop
  hosts: localhost
  gather_facts: true

  # pre_tasks, because roles run before tasks and the role needs nginx.
  pre_tasks:
    - name: Install nginx
      ansible.builtin.apt:
        name: [nginx, openssl]
        update_cache: true

  roles:
    - nginx_standin
