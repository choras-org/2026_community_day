# CHORAS locations, included in the HTTPS server block. On SRC this file goes to
# /etc/nginx/app-location-conf.d/choras.conf, next to SRC-Nginx's own files.

# Shared static frontend, built once with VITE_API_URL=/api.
location / {
    auth_basic "CHORAS";
    auth_basic_user_file /etc/nginx/passwd/choras;
    limit_req zone=choras_login burst=100 nodelay;
    limit_req_status 429;
    root /var/www/choras;
    # BrowserRouter: page reloads and deep links need the fallback.
    try_files $uri /index.html;
}

# Each participant's own backend, picked by the login (choras_users.conf).
location /api/ {
    auth_basic "CHORAS";
    auth_basic_user_file /etc/nginx/passwd/choras;
    limit_req zone=choras_login burst=100 nodelay;
    limit_req_status 429;
    # Room models are a few MB; this stops anyone filling the disk (SRC-Nginx sets no limit).
    client_max_body_size 500m;
    if ($choras_backend = "") {
        return 403;
    }
    # proxy_pass with a variable doesn't strip the prefix, so rewrite it away.
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://$choras_backend;
    # Don't pass the basic-auth password on to the backend.
    proxy_set_header Authorization "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Gunicorn's TIMEOUT is 120 s; meshing large models can take longer.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}
