# Rate limit per login name, against password guessing. Keyed by the name, not the
# IP: at the venue all participants share one public IP (guest Wi-Fi), so a per-IP
# limit would slow everyone down. 10 requests/s with bursts of 100 covers a page load
# plus the frontend's polling; excess requests get a 429. Requests without a login
# name (empty key) aren't counted; they only get the 401 login prompt.
limit_req_zone $remote_user zone=choras_login:1m rate=10r/s;
